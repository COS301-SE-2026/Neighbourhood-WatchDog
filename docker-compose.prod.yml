services:
  mediamtx:
    environment:
      MTX_WEBRTCENCRYPTION: "yes"
      MTX_WEBRTCSERVERCERT: /certs/fullchain.pem
      MTX_WEBRTCSERVERKEY: /certs/privkey.pem
      MTX_WEBRTCADDITIONALHOSTS: ${MTX_WEBRTCADDITIONALHOSTS:?must be set}
      MTX_WEBRTCALLOWORIGIN: ${MTX_WEBRTCALLOWORIGIN:?must be set}
      MTX_AUTHHTTPADDRESS: ${MTX_AUTHHTTPADDRESS:?must be set}
    build:
      context: ./mediamtx
    ports: 
      - "8554:8554" # RTSP
      - "8889:8889" # WebRTC
      - "127.0.0.1:9997:9997"
      - "8189:8189/udp"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx/mediamtx.yml
      - /opt/mediamtx-certs:/certs:ro
    restart: always
