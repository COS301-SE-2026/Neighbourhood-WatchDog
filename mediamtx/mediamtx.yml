rtpAddress: :8002
rtcpAddress: :8003
rtspAddress: :8554
webrtcAddress: :8889

webrtcEncryption: yes #TODO: Fix and make sure that the correct thing gets sent to the staging and the prod servers but "no" is used for dev
webrtcServerCert: /certs/fullchain.pem
webrtcServerKey: /certs/privkey.pem

api: yes
apiAddress: :9997

# MediaMTX calls the backend for every publish attempt.
# The backend permits only the credential derived for the requested
# cameras/<camera-uuid> path.
authMethod: http
authHTTPAddress: http://backend:8000/internal/mediamtx/auth

# Preserve the current public dashboard/video-reading behaviour.
# Publishing is deliberately NOT excluded and must pass HTTP auth.
authHTTPExclude:
  - action: read
  - action: playback
  - action: api

paths:
  # Accept dynamic publisher-owned paths such as:
  # cameras/<camera-uuid>
  all_others:
    source: publisher
    overridePublisher: true

webrtcAdditionalHosts:
  - localhost

webrtcAllowOrigin: "https://neighbourhood-watch-dog-intrepidcapstone-4790-teamintrepid.vercel.app/"
