services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  celery_worker:
    build:
      context: ./backend
      target: development
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      AWS_REGION: ${AWS_REGION}
      COGNITO_REGION: ${COGNITO_REGION}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
    volumes:
      - ./backend:/app
    command: celery -A app.core.celery_app.celery worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      target: development
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      AWS_REGION: ${AWS_REGION}
      COGNITO_REGION: ${COGNITO_REGION}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
    volumes:
      - ./backend:/app
    command: celery -A app.core.celery_app.celery beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "8000:8000" # TODO: Remove 
    environment:
      APP_ENV: development
      DEBUG: "true"
      TESTING: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}

      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}

      COGNITO_REGION: ${COGNITO_REGION}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      FRONTEND_URL: ${FRONTEND_URL}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM}
      NOTIFICATION_ENABLED: ${NOTIFICATION_ENABLED}
      SMTP_SENDER_EMAIL: ${SMTP_SENDER_EMAIL}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD}
      RTSP_ENCRYPTION_KEY: ${RTSP_ENCRYPTION_KEY}
      SKIP_DB_INIT: "true"
      MEDIAMTX_PUBLISH_MASTER_KEY: ${MEDIAMTX_PUBLISH_MASTER_KEY}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      FAILOVER_CONTROLLER_TOKEN: ${FAILOVER_CONTROLLER_TOKEN}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AI_URL: http://localhost:8001
      NEXT_PUBLIC_MEDIAMTX_WEBRTC_URL: http://localhost:8889
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  ai:
    build:
      context: ./ai
      target: development
    ports:
      - "8001:8001"
    environment:
      RTSP_URL: ${RTSP_URL}
      OPENCV_FFMPEG_CAPTURE_OPTIONS: "rtsp_transport;tcp"
      BACKEND_URL: http://backend:8000
      MKL_THREADING_LAYER: GNU
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      CLIP_RETENTION_DAYS: 7
      CAMERA_ID: "40000000-0000-0000-0000-000000000001"
    volumes:
      - ./ai:/app
    command: uvicorn app:app --host 0.0.0.0 --port 8001 --reload

  mediamtx:
    environment:
      MTX_WEBRTCADDITIONALHOSTS: stream-staging.neighbourhoodwatchdog.co.za,13.245.213.174
      MTX_WEBRTCENCRYPTION: "yes"
      MTX_WEBRTCSERVERCERT: /certs/fullchain.pem
      MTX_WEBRTCSERVERKEY: /certs/privkey.pem
    expose:
      - "9997"
    build:
      context: ./mediamtx
    ports:
      - "8554:8554"    # RTSP
      - "8889:8889"    # WebRTC
      - "8189:8189/udp"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx/mediamtx.yml
      - /opt/mediamtx-certs:/certs:ro
    restart: always

volumes:
  postgres_data:
  caddy_data:
  redis_data:
  # frontend_node_modules:
