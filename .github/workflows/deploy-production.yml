name: Deploy to Production AWS

on:
  push:
    branches: [ "main" ]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs: 
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c #v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update secret in Secrets Manager
        run: |
          aws secretsmanager put-secret-value \
            --secret-id watchdog/prod/env \
            --secret-string '{
              "SECRET_KEY": "${{ secrets.SECRET_KEY }}",
              "DATABASE_URL": "${{ secrets.DATABASE_URL }}",
              "REDIS_URL": "${{ secrets.REDIS_URL }}",
              "AWS_REGION": "${{ secrets.AWS_REGION }}",
              "S3_BUCKET_NAME": "${{ secrets.S3_BUCKET_NAME }}",
              "COGNITO_USER_POOL_ID": "${{ secrets.COGNITO_USER_POOL_ID }}",
              "COGNITO_CLIENT_ID": "${{ secrets.COGNITO_CLIENT_ID }}",
              "COGNITO_REGION": "${{ secrets.COGNITO_REGION }}",
              "TWILIO_ACCOUNT_SID": "${{ secrets.TWILIO_ACCOUNT_SID }}",
              "TWILIO_AUTH_TOKEN": "${{ secrets.TWILIO_AUTH_TOKEN }}",
              "TWILIO_WHATSAPP_FROM": "${{ secrets.TWILIO_WHATSAPP_FROM }}",
              "NOTIFICATION_ENABLED": "${{ secrets.NOTIFICATION_ENABLED }}",
              "RTSP_ENCRYPTION_KEY": "${{ secrets.RTSP_ENCRYPTION_KEY }}",
              "MEDIAMTX_PUBLISH_MASTER_KEY": "${{ secrets.MEDIAMTX_PUBLISH_MASTER_KEY }}",
              "TESTING": "${{ secrets.TESTING }}",
              "DEBUG": "${{ secrets.DEBUG }}",
              "POSTGRES_PASSWORD": "${{ secrets.POSTGRES_PASSWORD }}",
              "POSTGRES_USER": "${{ secrets.POSTGRES_USER }}",
              "POSTGRES_DB": "${{ secrets.POSTGRES_DB }}",
              "FRONTEND_URL": "${{ secrets.FRONTEND_URL }}",
              "DETECTION_CONFIDENCE_THRESHOLD": "${{ secrets.DETECTION_CONFIDENCE_THRESHOLD }}",
              "FAILOVER_CONTROLLER_TOKEN": "${{ secrets.FAILOVER_CONTROLLER_TOKEN }}",
              "GO2RTC_API_USERNAME": "${{ secrets.GO2RTC_API_USERNAME }}",
              "GO2RTC_API_PASSWORD": "${{ secrets.GO2RTC_API_PASSWORD }}",
              "FAILOVER_POLL_SECONDS": "${{ secrets.FAILOVER_POLL_SECONDS }}",
              "FAILOVER_FAILURE_PROBES": "${{ secrets.FAILOVER_FAILURE_PROBES }}",
              "SMTP_SENDER_EMAIL": "${{ secrets.SMTP_SENDER_EMAIL }}",
              "SMTP_APP_PASSWORD": "${{ secrets.SMTP_APP_PASSWORD }}"
            }'
      
      - name: Build, tag, and push image to ECR
        env: 
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ecr get-login-password --region ${AWS_REGION} \
            | docker login --username AWS --password-stdin 809809510183.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

          IMAGE_TAG="${{ github.sha }}"
          docker build -t watchdog-backend ./backend
          docker tag watchdog-backend:latest 809809510183.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/watchdog-backend:$IMAGE_TAG
          docker push 809809510183.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/watchdog-backend:$IMAGE_TAG

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Register new task definition with SHA-tagged image
        env: 
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ecs describe-task-definition \
            --task-definition watchdog-backend-task \
            --query 'taskDefinition' \
            --region ${AWS_REGION} > task-def.json

            NEW_TASK_DEF=$(jq --arg IMAGE "809809510183.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/watchdog-backend:${{ env.IMAGE_TAG }}" \
              '.containerDefinitions[0].image = $IMAGE 
              | .containerDefinitions[0].secrets = (
                (.containerDefinitions[0].secrets // [])
                | map(select(.name != "FAILOVER_CONTROLLER_TOKEN" and .name != "GO2RTC_API_USERNAME" and .name != "GO2RTC_API_PASSWORD"))
                + [
                    {"name": "FAILOVER_CONTROLLER_TOKEN", "valueFrom": "arn:aws:secretsmanager:af-south-1:809809510183:secret:watchdog/prod/env-Qthcyi:FAILOVER_CONTROLLER_TOKEN::"},
                    {"name": "GO2RTC_API_USERNAME", "valueFrom": "arn:aws:secretsmanager:af-south-1:809809510183:secret:watchdog/prod/env-Qthcyi:GO2RTC_API_USERNAME::"},
                    {"name": "GO2RTC_API_PASSWORD", "valueFrom": "arn:aws:secretsmanager:af-south-1:809809510183:secret:watchdog/prod/env-Qthcyi:GO2RTC_API_PASSWORD::"}
                  ]
              )
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
              task-def.json)

            echo "$NEW_TASK_DEF" > new-task-def.json

            NEW_REVISION=$(aws ecs register-task-definition \
              --cli-input-json file://new-task-def.json \
              --region ${AWS_REGION} \
              --query 'taskDefinition.revision' \
              --output text)
            
            echo "NEW_REVISION=$NEW_REVISION" >> $GITHUB_ENV
            echo "Registered task definition revision: $NEW_REVISION"

      - name: Register Celery worker task definition with SHA-tagged image
        env: 
          AWS_REGION: ${{ secrets.AWS_REGION }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          aws ecs describe-task-definition \
            --task-definition watchdog-celery-worker-task \
            --query 'taskDefinition' \
            --region ${AWS_REGION} > worker-task-def.json

          NEW_WORKER_TASK_DEF=$(jq --arg IMAGE "809809510183.dkr.ecr.${AWS_REGION}.amazonaws.com/watchdog-backend:${IMAGE_TAG}" \
            '.containerDefinitions[0].image = $IMAGE 
            | .containerDefinitions[0].secrets = (
                (.containerDefinitions[0].secrets // [])
                | map(select(.name != "S3_BUCKET_NAME"))
                + [{"name": "S3_BUCKET_NAME", "valueFrom": "arn:aws:secretsmanager:af-south-1:809809510183:secret:watchdog/prod/env-Qthcyi:S3_BUCKET_NAME::"}]
              )
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            worker-task-def.json)

          echo "$NEW_WORKER_TASK_DEF" > new-worker-task-def.json

          NEW_WORKER_REVISION=$(aws ecs register-task-definition \
            --cli-input-json file://new-worker-task-def.json \
            --region ${AWS_REGION} \
            --query 'taskDefinition.revision' \
            --output text)

          echo "NEW_WORKER_REVISION=$NEW_WORKER_REVISION" >> $GITHUB_ENV

      - name: Register Celery beat task definition with SHA-tagged image
        env: 
          AWS_REGION: ${{ secrets.AWS_REGION }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          aws ecs describe-task-definition \
            --task-definition watchdog-celery-beat-task \
            --query 'taskDefinition' \
            --region ${AWS_REGION} > beat-task-def.json

          NEW_BEAT_TASK_DEF=$(jq --arg IMAGE "809809510183.dkr.ecr.${AWS_REGION}.amazonaws.com/watchdog-backend:${IMAGE_TAG}" \
            '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            beat-task-def.json)

          echo "$NEW_BEAT_TASK_DEF" > new-beat-task-def.json

          NEW_BEAT_REVISION=$(aws ecs register-task-definition \
            --cli-input-json file://new-beat-task-def.json \
            --region ${AWS_REGION} \
            --query 'taskDefinition.revision' \
            --output text)

          echo "NEW_BEAT_REVISION=$NEW_BEAT_REVISION" >> $GITHUB_ENV

      - name: Deploy Celery worker and beat
        run: |
          aws ecs update-service \
            --cluster watchdog-prod-cluster \
            --service watchdog-celery-worker-service \
            --task-definition watchdog-celery-worker-task:${{ env.NEW_WORKER_REVISION }} \
            --force-new-deployment

          aws ecs update-service \
            --cluster watchdog-prod-cluster \
            --service watchdog-celery-beat-service \
            --task-definition watchdog-celery-beat-task:${{ env.NEW_BEAT_REVISION }} \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster watchdog-prod-cluster \
            --services watchdog-celery-worker-service watchdog-celery-beat-service

      - name: Run database migrations
        run: |
          RESULT=$(aws ecs run-task \
            --cluster watchdog-prod-cluster \
            --task-definition watchdog-backend-task \
            --launch-type EC2 \
            --overrides '{"containerOverrides":[{"name":"backend","memory":256,"command":["alembic","upgrade","head"]}]}')

          TASK_ARN=$(echo "$RESULT" | jq -r '.tasks[0].taskArn // empty')

          if [ -z "$TASK_ARN" ]; then
            echo "Migration task failed to start. Failure:"
            echo "$RESULT" | jq -r '.failures'
            exit 1
          fi

          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped \
            --cluster watchdog-prod-cluster \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster watchdog-prod-cluster \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          echo "Migration exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed"
            exit 1
          fi

      - name: Deploy new task definition to service
        run: | 
          aws ecs update-service \
            --cluster watchdog-prod-cluster \
            --service watchdog-backend-service \
            --task-definition watchdog-backend-task:${{ env.NEW_REVISION }} \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster watchdog-prod-cluster \
            --services watchdog-backend-service