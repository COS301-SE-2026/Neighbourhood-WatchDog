name: Deploy to Production AWS

on:
  push:
    branches: [ "main" ]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs: 
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update secret in Secrets Manager
        run: |
          aws secretsmanager put-secret-value \
            --secret-id watchdog/prod/env \
            --secret-string '{
              "SECRET_KEY": "${{ secrets.SECRET_KEY }}",
              "DATABASE_URL": "${{ secrets.DATABASE_URL }}",
              "REDIS_URL": "${{ secrets.REDIS_URL }}",
              "AWS_REGION": "${{ secrets.AWS_REGION }}",
              "S3_BUCKET_NAME": "${{ secrets.S3_BUCKET_NAME }}",
              "COGNITO_USER_POOL_ID": "${{ secrets.COGNITO_USER_POOL_ID }}",
              "COGNITO_CLIENT_ID": "${{ secrets.COGNITO_CLIENT_ID }}",
              "COGNITO_REGION": "${{ secrets.COGNITO_REGION }}",
              "TWILIO_ACCOUNT_SID": "${{ secrets.TWILIO_ACCOUNT_SID }}",
              "TWILIO_AUTH_TOKEN": "${{ secrets.TWILIO_AUTH_TOKEN }}",
              "TWILIO_WHATSAPP_FROM": "${{ secrets.TWILIO_WHATSAPP_FROM }}",
              "NOTIFICATION_ENABLED": "${{ secrets.NOTIFICATION_ENABLED }}",
              "RTSP_ENCRYPTION_KEY": "${{ secrets.RTSP_ENCRYPTION_KEY }}",
              "MEDIAMTX_PUBLISH_MASTER_KEY": "${{ secrets.MEDIAMTX_PUBLISH_MASTER_KEY }}",
              "TESTING": "${{ secrets.TESTING }}",
              "DEBUG": "${{ secrets.DEBUG }}",
              "POSTGRES_PASSWORD": "${{ secrets.POSTGRES_PASSWORD }}",
              "POSTGRES_USER": "${{ secrets.POSTGRES_USER }}",
              "POSTGRES_DB": "${{ secrets.POSTGRES_DB }}",
              "FRONTEND_URL": "${{ secrets.FRONTEND_URL }}",
              "DETECTION_CONFIDENCE_THRESHOLD": "${{ secrets.DETECTION_CONFIDENCE_THRESHOLD }}"
            }'
      
      - name: Build, tag, and push image to ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | docker login --username AWS --password-stdin 809809510183.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

          IMAGE_TAG="${{ github.sha }}"
          docker build -t watchdog-backend ./backend
          docker tag watchdog-backend:latest 809809510183.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/watchdog-backend:$IMAGE_TAG
          docker push 809809510183.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/watchdog-backend:$IMAGE_TAG

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Run database migrations
        run: |
          RESULT=$(aws ecs run-task \
            --cluster watchdog-prod-cluster \
            --task-definition watchdog-backend-task \
            --launch-type EC2 \
            --overrides '{"containerOverrides":[{"name":"backend","command":["alembic","upgrade","head"]}]}')

          TASK_ARN=$(echo "$RESULT" | jq -r '.tasks[0].taskArn // empty')

          if [ -z "$TASK_ARN" ]; then
            echo "Migration task failed to start. Failure:"
            echo "$RESULT" | jq -r '.failures'
            exit 1
          fi

          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped \
            --cluster watchdog-prod-cluster \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster watchdog-prod-cluster \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          echo "Migration exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed"
            exit 1
          fi

      - name: Register new task definition with SHA-tagged image
        run: |
          aws ecs describe-task-definition \
            --task-definition watchdog-backend-task \
            --query 'taskDefinition' \
            --region ${{ secrets.AWS_REGION }} > task-def.json

            NEW_TASK_DEF=$(jq --arg IMAGE "809809510183.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/watchdog-backend:${{ env.IMAGE_TAG }}"
              '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
              task-def.json)

            echo "$NEW_TASK_DEF" > new-task-def.json

            NEW_REVISION=$(aws ecs register-task-definition \
              --cli-input-json file://new-task-def.json \
              --region ${{ secrets.AWS_REGION }} \
              --query 'taskDefinition.revision' \
              --output text)
            
            echo "NEW_REVISION=$NEW_REVISION" >> $GITHUB_ENV
            echo "Registered task definition revision: $NEW_REVISION"

      - name: Deploy new task definition to service
        run: | 
          aws ecs update-service \
            --cluster watchdog-prod-cluster \
            --service watchdog-backend-service \
            --task-definition watchdog-backend-task:${{ env.NEW_REVISION }} \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster watchdog-prod-cluster \
            --services watchdog-backend-service