name: Deploy to Production

on:
  push:
    branches: [ "main", "fix/main-deployment" ]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs: 
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update secret in Secrets Manager
        run: |
          aws secretsmanager put-secret-value \
            --secret-id watchdog/prod/env \
            --secret-string '{
              "SECRET_KEY": "${{ secrets.SECRET_KEY }}",
              "DATABASE_URL": "${{ secrets.DATABASE_URL }}",
              "AWS_REGION": "${{ secrets.AWS_REGION }}",
              "S3_BUCKET_NAME": "${{ secrets.S3_BUCKET_NAME }}",
              "COGNITO_USER_POOL_ID": "${{ secrets.COGNITO_USER_POOL_ID }}",
              "COGNITO_CLIENT_ID": "${{ secrets.COGNITO_CLIENT_ID }}",
              "COGNITO_REGION": "${{ secrets.COGNITO_REGION }}",
              "TWILIO_ACCOUNT_SID": "${{ secrets.TWILIO_ACCOUNT_SID }}",
              "TWILIO_AUTH_TOKEN": "${{ secrets.TWILIO_AUTH_TOKEN }}",
              "TWILIO_WHATSAPP_FROM": "${{ secrets.TWILIO_WHATSAPP_FROM }}",
              "NOTIFICATION_ENABLED": "${{ secrets.NOTIFICATION_ENABLED }}",
              "RTSP_ENCRYPTION_KEY": "${{ secrets.RTSP_ENCRYPTION_KEY }}",
              "MEDIAMTX_PUBLISH_MASTER_KEY": "${{ secrets.MEDIAMTX_PUBLISH_MASTER_KEY }}",
              "TESTING": "${{ secrets.TESTING }}",
              "DEBUG": "${{ secrets.DEBUG }}"
              "POSTGRES_PASSWORD": "${{ secrets.POSTGRES_PASSWORD }}"
              "POSTGRES_USER": "${{ secrets.POSTGRES_USER }}"
              "POSTGRES_DB": "${{ secrets.POSTGRES_DB }}"
              "DETECTION_CONFIDENCE_THRESHOLD": "${{ secrets.DETECTION_CONFIDENCE_THRESHOLD }}"
            }'
      
      - name: Build, tag, and push image to ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | docker login --username AWS --password-stdin 809809510183.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          docker build -t watchdog-backend ./backend
          docker tag watchdog-backend:latest 809809510183.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/watchdog-backend:latest
          docker push 809809510183.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/watchdog-backend:latest

      - name: Run database migrations
        run: |
          TASK_ARN=$(aws ecs run-task \
          --cluster watchdog-prod-cluster \
          --task-definition watchdog-backend-task \
          --launch-type EC2 \
          --overrides '{"containerOverrides":[{"name":"backend","command":["alembic","upgrade","head"]}]}' \
          --query 'tasks[0].taskArn' \
          --output text)

          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped \
            --cluster watchdog-prod-cluster \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster watchdog-prod-cluster \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)
          
          echo "Migration exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then 
            echo "Migration failed"
            exit 1
          fi

      - name: Deploy new task definition to service
        run: | 
          aws ecs update-service \
            --cluster watchdog-prod-cluster \
            --service watchdog-backend-service \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster watchdog-prod-cluster \
            --services watchdog-backend-service