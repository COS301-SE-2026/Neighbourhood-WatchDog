name: Deploy to Production AWS

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: af-south-1
  ECR_REPOSITORY: watchdog-backend
  CLUSTER: watchdog-prod-cluster
  SIGNER: https://github.com/COS301-SE-2026/Neighbourhood-WatchDog/.github/workflows/ci.yml@refs/heads/dev

jobs:
  promote:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd #v6.3.0
        with:
          role-to-assume: arn:aws:iam::778312248988:role/watchdog-gha-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd #v2.1.7

      - name: Find the image staging is running
        id: image
        run: |
          STAGING_TASK_DEF=$(aws ecs describe-services --cluster watchdog-staging-cluster \
            --services watchdog-staging-service --query 'services[0].taskDefinition' --output text)
          IMAGE=$(aws ecs describe-task-definition --task-definition "$STAGING_TASK_DEF" \
            --query "taskDefinition.containerDefinitions[?name=='backend'].image | [0]" --output text)

          case "$IMAGE" in
            *@sha256:*) ;;
            *) echo "Staging is not running a digest-pinned image ($IMAGE); deploy to staging first"; exit 1 ;;
          esac

          DIGEST="${IMAGE##*@}"
          SOURCE_SHA=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageDigest="$DIGEST" --query 'imageDetails[0].imageTags[0]' --output text)

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Promoting \`$SOURCE_SHA\` → \`$DIGEST\` from staging" >> "$GITHUB_STEP_SUMMARY"

      - name: Check main matches the code staging tested
        env:
          SOURCE_SHA: ${{ steps.image.outputs.source_sha }}
          MAIN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          STAGING_TREE=$(git rev-parse "$SOURCE_SHA^{tree}")
          MAIN_TREE=$(git rev-parse "$MAIN_SHA^{tree}")
          if [ "$STAGING_TREE" != "$MAIN_TREE" ]; then
            echo "main ($MAIN_SHA) differs from the commit staging tested ($SOURCE_SHA)."
            echo "Merge dev into main only after staging has deployed it."
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2

      - name: Verify the image was signed by CI on dev
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          cosign verify "$IMAGE" \
            --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      - name: Register production task definitions with the same image
        id: taskdefs
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          register() {
            aws ecs describe-task-definition --task-definition "$1" --query taskDefinition > current.json
            jq --arg IMAGE "$IMAGE" '
              .containerDefinitions[0].image = $IMAGE
              | .containerDefinitions[0].environment =
                  ([(.containerDefinitions[0].environment // [])[]
                    | select(.name as $n | ["APP_ENV", "TESTING", "DEBUG", "REFRESH_COOKIE_SECURE"] | index($n) | not)]
                   + [{"name": "APP_ENV", "value": "production"},
                      {"name": "TESTING", "value": "false"},
                      {"name": "DEBUG", "value": "false"},
                      {"name": "REFRESH_COOKIE_SECURE", "value": "true"}])
              | .containerDefinitions[0].secrets =
                  [(.containerDefinitions[0].secrets // [])[]
                    | select(.name as $n | ["APP_ENV", "TESTING", "DEBUG", "REFRESH_COOKIE_SECURE"] | index($n) | not)]
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy)' current.json > next.json
            aws ecs register-task-definition --cli-input-json file://next.json \
              --query 'taskDefinition.taskDefinitionArn' --output text
          }

          echo "backend=$(register watchdog-backend-task)" >> "$GITHUB_OUTPUT"
          echo "worker=$(register watchdog-celery-worker-task)" >> "$GITHUB_OUTPUT"
          echo "beat=$(register watchdog-celery-beat-task)" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        env:
          BACKEND_TASK_DEF: ${{ steps.taskdefs.outputs.backend }}
        run: |
          TASK=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$BACKEND_TASK_DEF" --launch-type EC2 \
            --overrides '{"containerOverrides":[{"name":"backend","memory":256,"command":["alembic","upgrade","head"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "$TASK" ] || [ "$TASK" = "None" ]; then
            echo "Migration task failed to start (is the prod ASG scaled up?)"
            exit 1
          fi

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration exit code: $EXIT_CODE"
          [ "$EXIT_CODE" = "0" ]

      - name: Deploy Celery worker and beat
        env:
          WORKER_TASK_DEF: ${{ steps.taskdefs.outputs.worker }}
          BEAT_TASK_DEF: ${{ steps.taskdefs.outputs.beat }}
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service watchdog-celery-worker-service \
            --task-definition "$WORKER_TASK_DEF" > /dev/null
          aws ecs update-service --cluster "$CLUSTER" --service watchdog-celery-beat-service \
            --task-definition "$BEAT_TASK_DEF" > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" \
            --services watchdog-celery-worker-service watchdog-celery-beat-service

      - name: Deploy backend
        env:
          BACKEND_TASK_DEF: ${{ steps.taskdefs.outputs.backend }}
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service watchdog-backend-service \
            --task-definition "$BACKEND_TASK_DEF" > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services watchdog-backend-service