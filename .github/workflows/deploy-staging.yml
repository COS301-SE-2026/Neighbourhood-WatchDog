name: Deploy to Staging

on:
  push:
    branches: ["dev", "fix/staging-and-ci"]

jobs: 
  deploy:
    runs-on: ubuntu-latest
    environment: Staging

    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          COGNITO_REGION: ${{ secrets.COGNITO_REGION }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          NOTIFICATION_ENABLED: ${{ secrets.NOTIFICATION_ENABLED }}
          RTSP_ENCRYPTION_KEY: ${{ secrets.RTSP_ENCRYPTION_KEY }}
          MEDIAMTX_PUBLISH_MASTER_KEY: ${{ secrets.MEDIAMTX_PUBLISH_MASTER_KEY }}
          MTX_WEBRTCADDITIONALHOSTS: ${{ secrets.MTX_WEBRTCADDITIONALHOSTS }}
          MTX_WEBRTCALLOWORIGIN: ${{ secrets.MTX_WEBRTCALLOWORIGIN }}
          MTX_AUTHHTTPADDRESS: ${{ secrets.MTX_AUTHHTTPADDRESS }}
          TESTING: ${{ secrets.TESTING }}
          DEBUG: ${{ secrets.DEBUG }}
        run: |
          cat > .env << EOF
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          SECRET_KEY=${SECRET_KEY}
          FRONTEND_URL=${FRONTEND_URL}
          DATABASE_URL=${DATABASE_URL}
          REDIS_URL=${REDIS_URL}
          AWS_REGION=${AWS_REGION}
          AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
          S3_BUCKET_NAME=${S3_BUCKET_NAME}
          COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
          COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}
          COGNITO_REGION=${COGNITO_REGION}
          TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
          TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
          TWILIO_WHATSAPP_FROM=${TWILIO_WHATSAPP_FROM}
          NOTIFICATION_ENABLED=${NOTIFICATION_ENABLED}
          RTSP_ENCRYPTION_KEY=${RTSP_ENCRYPTION_KEY}
          MEDIAMTX_PUBLISH_MASTER_KEY=${MEDIAMTX_PUBLISH_MASTER_KEY}
          TESTING=${TESTING}
          DEBUG=${DEBUG}
          MTX_WEBRTCADDITIONALHOSTS=${MTX_WEBRTCADDITIONALHOSTS}
          MTX_WEBRTCALLOWORIGIN=${MTX_WEBRTCALLOWORIGIN}
          MTX_AUTHHTTPADDRESS=${MTX_AUTHHTTPADDRESS}
          DETECTION_CONFIDENCE_THRESHOLD=0.6
          EOF
      
      - name: Copy files to EC2
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 #v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".,!frontend"
          target: "/home/ubuntu/app"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 #1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull backend celery_worker celery_beat mediamtx
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build backend
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build celery_worker
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build celery_beat
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build mediamtx
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d backend celery_worker celery_beat mediamtx
            docker compose exec backend alembic upgrade head