name: Deploy to Staging

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [dev]

concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  AWS_REGION: af-south-1
  ECR_REPOSITORY: watchdog-backend
  CLUSTER: watchdog-staging-cluster
  SERVICE: watchdog-staging-service
  TASK_FAMILY: watchdog-staging-task
  MIGRATE_FAMILY: watchdog-staging-migrate
  SIGNER: https://github.com/COS301-SE-2026/Neighbourhood-WatchDog/.github/workflows/ci.yml@refs/heads/dev

jobs:
  deploy:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    environment: Staging
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd #v6.3.0
        with:
          role-to-assume: arn:aws:iam::778312248988:role/watchdog-gha-staging
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd #v2.1.7

      - name: Resolve the image CI built for this commit
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$SOURCE_SHA" --query 'imageDetails[0].imageDigest' --output text)
          echo "image=$REGISTRY/$ECR_REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Deploying \`$SOURCE_SHA\` → \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2

      - name: Verify the image was signed by CI on dev
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          cosign verify "$IMAGE" \
            --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      - name: Register task definitions with the new image
        id: taskdefs
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          register() {
            aws ecs describe-task-definition --task-definition "$1" --query taskDefinition > current.json
            jq --arg IMAGE "$IMAGE" '
              .containerDefinitions |= map(if .name == "redis" then . else .image = $IMAGE end)
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy)' current.json > next.json
            aws ecs register-task-definition --cli-input-json file://next.json \
              --query 'taskDefinition.taskDefinitionArn' --output text
          }

          echo "app=$(register "$TASK_FAMILY")" >> "$GITHUB_OUTPUT"
          echo "migrate=$(register "$MIGRATE_FAMILY")" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        env:
          MIGRATE_TASK_DEF: ${{ steps.taskdefs.outputs.migrate }}
        run: |
          TASK=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$MIGRATE_TASK_DEF" \
            --launch-type EC2 --query 'tasks[0].taskArn' --output text)
          if [ -z "$TASK" ] || [ "$TASK" = "None" ]; then
            echo "Migration task failed to start"
            exit 1
          fi

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration exit code: $EXIT_CODE"
          [ "$EXIT_CODE" = "0" ]

      - name: Deploy to the staging service
        env:
          APP_TASK_DEF: ${{ steps.taskdefs.outputs.app }}
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$APP_TASK_DEF" > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      - name: Check staging is healthy
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors \
            https://api-staging.neighbourhoodwatchdog.co.za/health