name: ci
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  python-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ruff 0.4.4
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  #v4.1.0
        with:
          version: "0.15.12"

      - name: Check using ruff
        run: ruff check

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"

      - name: Install pnpm
        run: npm install -g pnpm@8

      - name: Install frontend dependencies
        run: cd frontend && pnpm install

      - name: Run ESLint
        run: cd frontend && pnpm lint

  tests:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:test_password@localhost:5432/watchdog
      REDIS_URL: ${{ secrets.REDIS_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      COGNITO_REGION: ${{ secrets.COGNITO_REGION }}
      COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
      COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
      RTSP_ENCRYPTION_KEY: ${{ secrets.RTSP_ENCRYPTION_KEY }}
      FRONTEND_URL: https://testserver
      TESTING: true

    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: watchdog
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Postgres Connection
        env:
          PGPASSWORD: test_password
        run: |
          sudo apt-get -yqq update
          sudo apt-get -yqq install postgresql-client
          psql -h localhost -U postgres -d watchdog -c "SELECT 1;"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"

      - name: Install pnpm
        run: npm install -g pnpm@8

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        run: cd frontend && pnpm install

      - name: Run database migrations
        run: cd backend && alembic upgrade head

      # - name: Seed test data (seed.sql)
      #   env:
      #     PGPASSWORD: test_password
      #   run: psql -h localhost -U postgres -d watchdog -f seed.sql

      - name: Seed test data
        run: cd backend && python seed.py

      - name: Install PyTest Cov
        run: pip install pytest-cov

      - name: Run backend tests
        run: cd tests/backend && pytest --cov --cov-branch --cov-report=xml

      - name: Run frontend tests
        run: cd frontend && npx jest --coverage #pnpm test

      - name: Start backend
        run: |
          cd backend
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 & 
          npx wait-on tcp:8000 -t 60000

      - name: Build frontend
        run: cd frontend && pnpm build

      - name: Start frontend
        run: |
          cd frontend
          nohup pnpm start -p 3000 &
          npx wait-on http://localhost:3000 -t 60000

      - name: Install E2E dependencies
        run: cd tests/e2e && pnpm install

      - name: Install Playwright browsers
        run: cd tests/e2e && pnpm exec playwright install

      - name: Run E2E tests
        run: cd tests/e2e && pnpm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@cddd853df119a48c5be31a973f8cd97e12e35e16 # v6.0.1
        with:
          files: coverage/lcov.info,coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"

      - name: Install pnpm
        run: npm install -g pnpm@8

      - name: Install frontend dependencies
        run: cd frontend && pnpm install

      - name: Build frontend
        run: cd frontend && pnpm build

  type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install mypy
        run: pip install mypy

      - name: Type check backend
        run: cd backend && mypy . --ignore-missing-imports

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install setuptools
        run: pip install --upgrade "setuptools>=83.0.0"

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Run Bandit
        run: bandit -r backend/ -ll

      - name: Check pip dependencies
        run: pip-audit
