name: ci
on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  python-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Install ruff 0.15.12
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 #v4.1.0
        with:
          version: "0.15.12"

      - name: Check using ruff
        run: ruff check

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: "20.9.0"

      - name: Install pnpm
        run: npm install -g pnpm@10.30.3

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Run ESLint
        run: cd frontend && pnpm lint

  tests:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:test_password@localhost:5432/watchdog
      REDIS_URL: ${{ secrets.REDIS_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      COGNITO_REGION: ${{ secrets.COGNITO_REGION }}
      COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
      COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
      RTSP_ENCRYPTION_KEY: ${{ secrets.RTSP_ENCRYPTION_KEY }}
      FRONTEND_URL: https://testserver
      TESTING: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Build PostgreSQL test image
        run: docker build --tag watchdog-postgres ./postgres

      - name: Start PostgreSQL
        run: |
          docker run --detach \
            --name watchdog-postgres \
            --publish 5432:5432 \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=test_password \
            --env POSTGRES_DB=watchdog \
            watchdog-postgres

          for i in {1..30}; do
            if docker exec watchdog-postgres pg_isready -U postgres -d watchdog; then
              exit 0
            fi
            sleep 2
          done

          docker logs watchdog-postgres
          exit 1

      - name: Verify Postgres Connection
        env:
          PGPASSWORD: test_password
        run: |
          sudo apt-get -yqq update
          sudo apt-get -yqq install postgresql-client
          psql -h localhost -U postgres -d watchdog -c "SELECT 1;"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: "20.9.0"

      - name: Install pnpm
        run: npm install -g pnpm@10.30.3

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Run database migrations
        run: cd backend && alembic upgrade head

      - name: Seed test data
        run: cd backend && python seed.py

      - name: Install PyTest Cov
        run: pip install pytest-cov

      - name: Run backend tests
        run: cd tests/backend && pytest --cov=app --cov-branch --cov-report=xml

      - name: Run frontend tests
        run: cd frontend && npx jest --coverage #pnpm test

      - name: Start backend
        run: |
          cd backend
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 & 
          npx wait-on tcp:8000 -t 60000

      - name: Build frontend
        run: cd frontend && pnpm build

      - name: Start frontend
        run: |
          cd frontend
          nohup pnpm start -p 3000 &
          npx wait-on http://localhost:3000 -t 60000

      - name: Install E2E dependencies
        run: cd tests/e2e && pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd tests/e2e && pnpm exec playwright install

      - name: Run E2E tests
        run: cd tests/e2e && pnpm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@cddd853df119a48c5be31a973f8cd97e12e35e16 #v6.0.1
        with:
          files: tests/frontend/coverage/lcov.info,tests/backend/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: "20.9.0"

      - name: Install pnpm
        run: npm install -g pnpm@10.30.3

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Build frontend
        run: cd frontend && pnpm build

  type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: "3.11"

      - name: Install mypy
        run: pip install mypy

      - name: Type check backend
        run: cd backend && mypy . --ignore-missing-imports

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Check prod compose fails closed
        run: |
          if grep -nE '\$\{[A-Z_]*(SECRET|KEY|TOKEN|PASSWORD)[A-Z_]*:-' docker-compose*.yml; then
            echo "Secret-named variables must not have defaults; use \${VAR:?must be set}"
            exit 1
          fi

          if grep -nE ':-(false)?\}' docker-compose.prod.yml; then
            echo "docker-compose.prod.yml must not default to false or empty"
            exit 1
          fi

      - name: Check prod compose only publishes MediaMTX ports
        env:
          MTX_WEBRTCADDITIONALHOSTS: ci.invalid
          MTX_WEBRTCALLOWORIGIN: https://ci.invalid
          MTX_AUTHHTTPADDRESS: https://ci.invalid/internal/mediamtx/auth
        run: |
          published=$(docker compose -f docker-compose.prod.yml config --format json \
            | jq -r '.services[] | .ports[]? | "\(.host_ip // "0.0.0.0"):\(.published)/\(.protocol)"' \
            | sort)
          allowed=$(printf '%s\n' \
            "0.0.0.0:8189/udp" \
            "0.0.0.0:8554/tcp" \
            "0.0.0.0:8889/tcp" \
            "127.0.0.1:9997/tcp" | sort)
          echo "Published ports:"; echo "$published"
          if [ "$published" != "$allowed" ]; then
            echo "docker-compose.prod.yml publishes unexpected ports. Allowed:"; echo "$allowed"
            exit 1
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: "3.11"

      - name: Install setuptools
        run: pip install --only-binary ":all:" "setuptools==84.1.0"

      - name: Install security tools
        run: pip install --only-binary ":all:" "bandit==1.9.4" "pip-audit==2.10.1"

      - name: Run Bandit
        run: bandit -r backend/ -ll

      - name: Audit backend Python dependencies
        run: pip-audit -r backend/requirements.txt --disable-pip --no-deps # this last part is to make sure that it checks it w/o installing it

      - name: Audit AI Python dependencies
        run: pip-audit -r ai/requirements.txt --disable-pip --no-deps

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: "20.9.0"

      - name: Install pnpm
        run: npm install -g pnpm@10.30.3

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: pnpm audit --prod --audit-level high

  image:
    needs: [python-lint, type-check, tests, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: assume the AWS role and sign keylessly with cosign

    env:
      AWS_REGION: af-south-1
      ECR_REPOSITORY: watchdog-backend
      LOCAL_IMAGE: watchdog-backend:ci
      # Only pushes to dev publish an image; main promotes the digest staging is running
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}

    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 #v4.4.1

      - name: Build backend production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc #v7.4.0
        with:
          context: ./backend
          target: production
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Smoke test the built image
        run: |
          docker network create smoke
          docker build --tag watchdog-postgres ./postgres
          docker run --detach --name db --network smoke \
            --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD=smoke --env POSTGRES_DB=watchdog \
            watchdog-postgres
          # redis:7-alpine, the same digest as in the docker-compose.yml 
          docker run --detach --name redis --network smoke \
            redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499

          for i in {1..30}; do
            docker exec db pg_isready -U postgres -d watchdog && break
            sleep 2
          done

          # APP_ENV=staging so the fail-closed config guard runs against this image
          cat > smoke.env <<EOF
          APP_ENV=staging
          DEBUG=false
          TESTING=false
          REFRESH_COOKIE_SECURE=true
          DATABASE_URL=postgresql+asyncpg://postgres:smoke@db:5432/watchdog
          REDIS_URL=redis://redis:6379/0
          SECRET_KEY=ci-smoke-test
          AWS_REGION=af-south-1
          COGNITO_REGION=af-south-1
          COGNITO_USER_POOL_ID=af-south-1_smoketest
          COGNITO_CLIENT_ID=smoke-test
          RTSP_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')
          MEDIAMTX_PUBLISH_MASTER_KEY=ci-smoke-test
          EOF

          docker run --rm --network smoke --env-file smoke.env "$LOCAL_IMAGE" alembic upgrade head
          docker run --detach --name api --network smoke --env-file smoke.env --publish 8000:8000 "$LOCAL_IMAGE"

          if ! curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 2 http://localhost:8000/health; then
            docker logs api
            exit 1
          fi

      - name: Scan image for CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Report HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c #v0.24.3
        with:
          image: ${{ env.LOCAL_IMAGE }}
          format: spdx-json
          output-file: sbom-backend.spdx.json
          artifact-name: sbom-backend.spdx.json

      - name: Configure AWS credentials
        if: env.PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd #v6.3.0
        with:
          role-to-assume: arn:aws:iam::778312248988:role/watchdog-gha-ci
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: env.PUBLISH == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd #v2.1.7

      - name: Push image tagged with the commit SHA
        if: env.PUBLISH == 'true'
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          REMOTE="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          # Tags are immutable, so a re-run of the same commit reuses the existing image
          if ! aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            docker tag "$LOCAL_IMAGE" "$REMOTE"
            docker push "$REMOTE"
          fi

          DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=$REGISTRY/$ECR_REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$REMOTE\` → \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2

      - name: Sign image and attach SBOM
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate sbom-backend.spdx.json "$IMAGE"

