name: ZAP Baseline Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to scan'
        required: false
        default: 'https://api-staging.neighbourhoodwatchdog.co.za'

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Get JWT for authenciated scan
        id: auth
        run: |
          TOKEN=$(curl -s -X POST "${{ github.event.inputs.target_url }}/auth/login" \
            -H "Content-Type: application/json" \
            -d "{ \"email\": \"${{ secrets.ZAP_TEST_EMAIL }}\", \"password\": \"${{ secrets.ZAP_TEST_PASSWORD }}\" }" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['data']['access_token'])")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: ZAP Baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 #0.12.0
        env:
          ZAP_AUTH_HEADER: "Authorization"
          ZAP_AUTH_HEADER_VALUE: "Bearer ${{ steps.auth.outputs.token }}"
          ZAP_AUTH_HEADER_SITE: ${{ github.event.inputs.target_url }}
        with:
          target: ${{ github.event.inputs.target_url }}
          cmd_options: '-a'
          issue_title: 'ZAP Scan Report'
          fail_action: false

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
