name: Deploy mediamtx to Production

on:
  push:
    branches: [ main ]
    paths:
      - 'mediamtx/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy mediamtx files to instance
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 #v1.0.0
        with:
          host: ${{ secrets.MEDIAMTX_HOST }}
          username: ${{ secrets.MEDIAMTX_USER }}
          key: ${{ secrets.MEDIAMTX_SSH_KEY }}
          source: "mediamtx,docker-compose.yml,docker-compose.prod.yml"
          target: "/home/ubuntu/app"

      - name: Write mediamtx .env
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 #1.0.3
        with:
          host: ${{ secrets.MEDIAMTX_HOST }}
          username: ${{ secrets.MEDIAMTX_USER }}
          key: ${{ secrets.MEDIAMTX_SSH_KEY }}
          script: |
            cat > /home/ubuntu/app/.env << EOF
            MTX_WEBRTCADDITIONALHOSTS=${MTX_WEBRTCADDITIONALHOSTS}
            MTX_WEBRTCALLOWORIGIN=${MTX_WEBRTCALLOWORIGIN}
            MTX_AUTHHTTPADDRESS=${MTX_AUTHHTTPADDRESS}
            EOF

      - name: Redeploy mediamtx
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 #1.0.3
        with:
          host: ${{ secrets.MEDIAMTX_HOST }}
          username: ${{ secrets.MEDIAMTX_USER }}
          key: ${{ secrets.MEDIAMTX_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build mediamtx
            docker compose -f docker-compose.yml -f docker-compose.prod.yml logs mediamtx --tail 30