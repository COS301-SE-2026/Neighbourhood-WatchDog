name: Deploy mediamtx to Staging

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: staging-mediamtx-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}
    runs-on: ubuntu-latest
    environment: Staging
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd #v6.3.0
        with:
          role-to-assume: arn:aws:iam::778312248988:role/watchdog-gha-staging
          aws-region: af-south-1

      - name: Redeploy mediamtx over SSM
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=watchdog-staging-mediamtx" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          BASE="https://raw.githubusercontent.com/$REPO/$SOURCE_SHA"

          # Runs as root on the host; values above are expanded here, on the runner
          SCRIPT=$(cat <<EOF
          set -eu
          cd /home/ubuntu/app
          mkdir -p mediamtx
          curl -fsSL "$BASE/docker-compose.prod.yml" -o docker-compose.prod.yml
          curl -fsSL "$BASE/mediamtx/Dockerfile" -o mediamtx/Dockerfile
          curl -fsSL "$BASE/mediamtx/mediamtx.yml" -o mediamtx/mediamtx.yml
          chown -R ubuntu:ubuntu /home/ubuntu/app
          docker compose -f docker-compose.prod.yml up -d --build mediamtx
          docker compose -f docker-compose.prod.yml ps mediamtx
          EOF
          )

          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "mediamtx $SOURCE_SHA" \
            --parameters "$(jq -n --arg s "$SCRIPT" '{commands: ($s | split("\n"))}')" \
            --query 'Command.CommandId' --output text)

          for _ in $(seq 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "SSM status: $STATUS"
          [ "$STATUS" = "Success" ]

      - name: Check WebRTC endpoint answers over TLS
        run: |
          curl --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors -o /dev/null \
            -w "%{http_code}\n" https://stream-staging.neighbourhoodwatchdog.co.za:8889/
