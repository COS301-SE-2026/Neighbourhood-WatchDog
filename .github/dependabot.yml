version: 2
updates:
  # Actions pinned to SHAs, updated while keeping the "#vX" comments
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # Dockerfiles with FROM lines (none at the root)
  - package-ecosystem: "docker"
    directories:
      - "/ai"
      - "/backend"
      - "/frontend"
      - "/mediamtx"
      - "/postgres"
    schedule:
      interval: "weekly"
    groups:
      base-images:
        patterns:
          - "*"

  # requirements.txt files
  - package-ecosystem: "pip"
    directories:
      - "/ai"
      - "/backend"
      - "/watchdog-infra"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # package.json files and their lockfiles
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/frontend"
      - "/tests/e2e"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"